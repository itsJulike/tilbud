<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tilbud</title>
<meta name="description" content="Tilbud fra tilbudsaviserne sammenlignet på literpris">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tilbud">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121214" media="(prefers-color-scheme: dark)">
<link rel="icon" href="ikon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="ikon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  /* Farver: 60 % neutral baggrund, 30 % tekst, 10 % grøn accent. Rav kun til advarsler. */
  :root {
    --bg: #f6f5f2; --kort: #ffffff; --tekst: #1b1c1e;
    --t2: rgb(27 28 30 / .72); --t3: rgb(27 28 30 / .56); --linje: rgb(27 28 30 / .09);
    --accent: #0a6b4f; --accent-5: rgb(10 107 79 / .06); --accent-12: rgb(10 107 79 / .12);
    --bar: #a9d9c4; --bar-bedst: #0a6b4f; --i-dag: #c2410c;
    --rav: #8a5a00; --rav-bg: #fdf3dc;
    --skygge: 0 1px 2px rgb(60 50 20 / .05), 0 8px 24px rgb(60 50 20 / .06);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121214; --kort: #1c1c1f; --tekst: #f2f2f4;
      --t2: rgb(242 242 244 / .74); --t3: rgb(242 242 244 / .56); --linje: rgb(242 242 244 / .09);
      --accent: #5fd3a6; --accent-5: rgb(95 211 166 / .07); --accent-12: rgb(95 211 166 / .14);
      --bar: #2b5546; --bar-bedst: #5fd3a6; --i-dag: #ff8a50;
      --rav: #f0c060; --rav-bg: rgb(240 192 96 / .12);
      --skygge: 0 1px 2px rgb(0 0 0 / .3), 0 8px 24px rgb(0 0 0 / .25);
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--tekst);
    font: 400 16px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    -webkit-tap-highlight-color: transparent;
  }
  /* Fire størrelser: 34 · 20 · 16 · 13. To vægte: 400 · 650. */
  main { max-width: 560px; margin: 0 auto; padding: 16px 16px 48px; }
  .tal { font-variant-numeric: tabular-nums; }
  .t3 { color: var(--t3); }
  .lille { font-size: 13px; }

  header { padding: 8px 4px 24px; }
  header .app { font-size: 13px; font-weight: 650; color: var(--t3); letter-spacing: .02em; }
  header h1 { font-size: 34px; font-weight: 650; line-height: 1.15; margin: 0; letter-spacing: -.02em; }
  header .opd { font-size: 13px; color: var(--t3); margin-top: 4px; }

  .kort { background: var(--kort); border-radius: 24px; box-shadow: var(--skygge); }
  .sektion { margin-top: 32px; }
  .sektion > h2 { font-size: 13px; font-weight: 650; color: var(--t3); text-transform: uppercase;
                  letter-spacing: .06em; margin: 0 4px 8px; }

  /* Svaret: hvor er det billigst lige nu? */
  .helt { padding: 24px; position: relative; overflow: hidden; }
  .helt::before { content: ""; position: absolute; inset: -40% -20% auto auto; width: 70%; aspect-ratio: 1;
                  background: radial-gradient(closest-side, var(--accent-12), transparent); pointer-events: none; }
  .helt .lbl { font-size: 13px; font-weight: 650; color: var(--accent); }
  .helt .butik { font-size: 20px; font-weight: 650; margin-top: 4px; }
  .helt .pris { font-size: 34px; font-weight: 650; line-height: 1.1; margin-top: 16px; letter-spacing: -.02em; }
  .helt .pris span { font-size: 16px; font-weight: 400; color: var(--t2); letter-spacing: 0; }
  .helt .detalje { color: var(--t2); margin-top: 4px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  .chip { font-size: 13px; font-weight: 650; padding: 4px 12px; border-radius: 999px;
          background: var(--accent-5); color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent-12); }
  .chip.rav { background: var(--rav-bg); color: var(--rav); box-shadow: none; }
  .chip.neutral { background: var(--linje); color: var(--t2); box-shadow: none; }
  .slut { margin-top: 16px; }
  .slut .spor { height: 4px; border-radius: 4px; background: var(--linje); overflow: hidden; margin-top: 8px; }
  .slut .spor i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }

  /* Råd: købe nu eller vente? */
  .raad { display: grid; grid-template-columns: 40px 1fr; gap: 0 16px; align-items: center;
          padding: 16px 24px; margin-top: 12px; }
  .raad .ikon { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center;
                font-size: 20px; background: var(--accent-5); }
  .raad.vent .ikon { background: var(--rav-bg); }
  .raad b { font-weight: 650; }
  .raad p { margin: 0; }
  .raad p + p { color: var(--t2); font-size: 13px; }

  /* Tidslinje */
  .tidslinje { padding: 16px 12px 12px; }
  .tl-gitter { display: grid; grid-template-columns: minmax(72px, 120px) repeat(14, minmax(0, 1fr));
               column-gap: 1px; row-gap: 4px; align-items: center; }
  .tl-navn { font-size: 13px; line-height: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
             padding-right: 8px; color: var(--t2); }
  .tl-navn b { font-weight: 650; color: var(--tekst); display: block; }
  .tl-navn.bedst b { color: var(--accent); }
  .tl-dag { font-size: 13px; color: var(--t3); text-align: center; line-height: 1.3; padding: 0 0 8px; white-space: nowrap; overflow: visible;
            align-self: stretch; border-radius: 8px 8px 0 0; }
  .tl-dag b { display: block; font-weight: 650; color: var(--t2); }
  .tl-dag.i-dag, .tl-dag.i-dag b { color: var(--i-dag); }
  .tl-dag.weekend { background: var(--linje); }
  .bar { height: 36px; border: 0; padding: 0; border-radius: 8px; background: var(--bar); cursor: pointer; }
  .bar.bedst { background: var(--bar-bedst); }
  .bar.fortsat-v { border-top-left-radius: 0; border-bottom-left-radius: 0; }
  .bar.fortsat-h { border-top-right-radius: 0; border-bottom-right-radius: 0; }
  .tl-forklaring { font-size: 13px; color: var(--t3); margin: 12px 4px 0; }
  .vis-flere { display: block; width: 100%; min-height: 44px; margin-top: 8px; border: 0; border-radius: 12px;
               background: var(--accent-5); color: var(--accent); font: inherit; font-size: 13px; font-weight: 650;
               cursor: pointer; }

  /* Liste */
  .liste { list-style: none; margin: 0; padding: 4px 0; }
  .liste li { display: grid; grid-template-columns: 40px 1fr auto; gap: 0 12px; padding: 12px 16px; align-items: start;
              border-radius: 16px; margin: 0 4px; scroll-margin: 96px; }
  .liste li + li { box-shadow: 0 -1px 0 var(--linje); }
  .liste li.fremhaevet { background: var(--accent-5); box-shadow: none; }
  .liste li.fremhaevet + li { box-shadow: none; }
  .logo { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-size: 13px;
          font-weight: 650; background: var(--linje); color: var(--t2); }
  .fremhaevet .logo { background: var(--accent); color: var(--kort); }
  .liste .navn { font-weight: 650; }
  .liste .info { font-size: 13px; color: var(--t2); }
  .liste .pris { text-align: right; font-weight: 650; }
  .liste .pris span { display: block; font-size: 13px; font-weight: 400; color: var(--t3); }
  .liste .chips { grid-column: 2 / -1; margin-top: 8px; gap: 4px; }
  .liste .chip { font-size: 13px; font-weight: 400; padding: 0 8px; }


  /* Beregner: hvad koster x rammer inkl. pant? */
  .beregner { padding: 24px; margin-top: 12px; }
  .beregner h3 { font-size: 20px; font-weight: 650; margin: 0 0 16px; }
  .beregner select { width: 100%; min-height: 44px; padding: 0 12px; border: 0; border-radius: 12px;
                     background: var(--linje); color: var(--tekst); font: inherit; appearance: none;
                     -webkit-appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--t3) 50%),
                     linear-gradient(135deg, var(--t3) 50%, transparent 50%);
                     background-position: right 20px center, right 14px center; background-size: 6px 6px; background-repeat: no-repeat; }
  .stepper { display: grid; grid-template-columns: 56px 1fr 56px; align-items: center; margin-top: 16px;
             background: var(--accent-5); border-radius: 16px; padding: 4px; }
  .stepper button { height: 48px; border: 0; border-radius: 12px; background: var(--kort); color: var(--accent);
                    font: inherit; font-size: 20px; font-weight: 650; cursor: pointer; box-shadow: var(--skygge); }
  .stepper button:disabled { opacity: .4; box-shadow: none; }
  .stepper output { text-align: center; font-weight: 650; }
  .stepper output span { display: block; font-size: 13px; font-weight: 400; color: var(--t2); }
  .regning { margin: 16px 0 0; display: grid; grid-template-columns: 1fr auto; gap: 8px 0; font-size: 13px; color: var(--t2); }
  .regning dd { margin: 0; padding-left: 16px; text-align: right; }
  .regning .i-alt { font-size: 16px; color: var(--tekst); font-weight: 650; padding-top: 12px; border-top: 1px solid var(--linje); }
  .regning .i-alt + dd { font-size: 34px; line-height: 1.1; color: var(--tekst); font-weight: 650; padding-top: 12px;
                         border-top: 1px solid var(--linje); letter-spacing: -.02em; }
  .beregner .note { margin: 12px 0 0; font-size: 13px; }
  .beregner .note.rav { color: var(--rav); }
  .beregner .note.spar { color: var(--accent); font-weight: 650; }
  .tom, .fejl { padding: 24px; text-align: center; color: var(--t2); }
  .fejl button { margin-top: 16px; min-height: 44px; padding: 0 24px; border: 0; border-radius: 12px;
                 background: var(--accent); color: var(--kort); font: inherit; font-weight: 650; cursor: pointer; }
  footer { color: var(--t3); font-size: 13px; margin: 48px 4px 0; }
  footer a { color: var(--accent); }

  /* Indlæsning */
  .skelet { border-radius: 24px; background: var(--kort); box-shadow: var(--skygge); margin-bottom: 12px; position: relative; overflow: hidden; }
  .skelet::after { content: ""; position: absolute; inset: 0; transform: translateX(-100%);
                   background: linear-gradient(90deg, transparent, var(--linje), transparent);
                   animation: glimt 1.2s infinite; }
  @keyframes glimt { to { transform: translateX(100%); } }

  /* Lille fejring af svaret */
  .ind { animation: ind .45s cubic-bezier(.2,.8,.2,1) both; }
  .ind.f2 { animation-delay: .08s; } .ind.f3 { animation-delay: .16s; }
  @keyframes ind { from { opacity: 0; transform: translateY(8px) scale(.98); } }
  .blink { animation: blink 1.6s ease-out; }
  @keyframes blink { from { background: var(--accent-12); } }
  @media (prefers-reduced-motion: reduce) { .ind, .blink, .skelet::after { animation: none; } }
</style>
</head>
<body>
<main>
  <header>
    <div class="app">Tilbud</div>
    <h1 id="titel">Pepsi Max</h1>
    <div class="opd" id="opdateret">&nbsp;</div>
  </header>
  <div id="indhold" aria-busy="true">
    <div class="skelet" style="height:232px"></div>
    <div class="skelet" style="height:72px"></div>
  </div>
  <footer>
    Data fra eTilbudsavis, hentet to gange i døgnet. Alle priser er sammenlignet pr. liter og er uden pant.
    <a href="tilbud.ics">Abonnér på kalenderen</a>
  </footer>
</main>
<script>
(() => {
  const DAGE = 14, FOERST_VIST = 6;
  const UGEDAG = ["søn", "man", "tir", "ons", "tor", "fre", "lør"];
  const UGEDAG_LANG = ["søndag", "mandag", "tirsdag", "onsdag", "torsdag", "fredag", "lørdag"];
  const kr = v => v.toLocaleString("da-DK", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

  // Alt sammenlignes på literpris, så pakker i forskellige størrelser kan stå side om side.
  const maal = "literpris";
  let visAlle = false;

  const iDag = new Intl.DateTimeFormat("sv-SE", { timeZone: "Europe/Copenhagen" }).format(new Date());
  const dato = iso => { const [y, m, d] = iso.split("-").map(Number); return new Date(Date.UTC(y, m - 1, d)); };
  const plus = (iso, n) => { const d = dato(iso); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
  const dageTil = iso => Math.round((dato(iso) - dato(iDag)) / 864e5);
  const kort = iso => { const d = dato(iso); return `${UGEDAG[d.getUTCDay()]} ${d.getUTCDate()}/${d.getUTCMonth() + 1}`; };
  const relDag = iso => {
    const n = dageTil(iso);
    if (n === 0) return "i dag";
    if (n === 1) return "i morgen";
    if (n > 1 && n < 7) return UGEDAG_LANG[dato(iso).getUTCDay()];
    return kort(iso);
  };
  const periode = t => `${kort(t.fra)} – ${kort(t.til)}`;
  const enhed = () => "kr/l";
  const sorter = lst => [...lst].sort((a, b) => a[maal] - b[maal] || a.fra.localeCompare(b.fra));
  const id = t => t.butik + t.fra + t.pris;
  const initialer = n => n.replace(/[^\p{L}\p{N} ]/gu, "").split(/\s+/).filter(Boolean)
    .map(o => o[0]).join("").slice(0, 2).toUpperCase() || n.slice(0, 2);
  const usikker = t => t.noter.some(n => n.includes("ikke nævnt"));

  function helt(vare, t) {
    if (!t) return `<div class="kort tom ind">Ingen tilbud på ${esc(vare.navn)} lige nu.<br>
      <span class="lille t3">Appen holder øje og viser dem her, så snart de dukker op.</span></div>`;
    const chips = [];
    if (vare.normal_literpris) {
      const spar = Math.round((1 - t.literpris / vare.normal_literpris) * 100);
      if (spar > 0) chips.push(`<span class="chip">${spar} % under normalpris</span>`);
    }
    if (vare.alarm_max_literpris && t.literpris <= vare.alarm_max_literpris) chips.push(`<span class="chip">Under din grænse</span>`);
    if (usikker(t)) chips.push(`<span class="chip rav">Avisen nævner ikke ${esc(vare.navn)}</span>`);
    const laengde = dageTil(t.til) - dageTil(t.fra) + 1, gaaet = -dageTil(t.fra) + 1;
    const restTekst = dageTil(t.til) === 0 ? "Slutter i dag" : `Gælder til og med ${relDag(t.til)}`;
    return `<div class="kort helt ind">
      <div class="lbl">Billigst lige nu</div>
      <div class="butik">${esc(t.butik)}</div>
      <div class="pris tal">${kr(t[maal])} <span>${enhed()}</span></div>
      <div class="detalje">${esc(t.pakning)} for ${kr(t.pris)} kr</div>
      ${chips.length ? `<div class="chips">${chips.join("")}</div>` : ""}
      <div class="slut lille t3">${restTekst}
        <div class="spor"><i style="width:${Math.min(100, Math.max(6, gaaet / laengde * 100))}%"></i></div></div>
    </div>`;
  }

  function raad(nu, kommende) {
    const snart = sorter(kommende.filter(t => dageTil(t.fra) <= 7))[0];
    if (snart && (!nu || snart[maal] < nu[maal] - 0.005)) {
      const forskel = nu ? ` – ${kr(nu[maal] - snart[maal])} ${enhed()} billigere` : "";
      return `<div class="kort raad vent ind f2"><div class="ikon">⏳</div><div>
        <p><b>Vent til ${relDag(snart.fra)}</b>${forskel}</p>
        <p>${esc(snart.butik)}: ${kr(snart[maal])} ${enhed()} · ${esc(snart.pakning)} for ${kr(snart.pris)} kr · ${periode(snart)}</p></div></div>`;
    }
    if (nu) return `<div class="kort raad ind f2"><div class="ikon">✅</div><div>
      <p><b>Slå til nu</b></p><p>Der er ikke noget billigere på vej i de aviser, der er ude.</p></div></div>`;
    return "";
  }

  function tidslinje(tilbud) {
    const slut = plus(iDag, DAGE - 1);
    const alle = sorter(tilbud.filter(t => t.til >= iDag && t.fra <= slut));
    if (!alle.length) return "";
    const synlige = visAlle ? alle : alle.slice(0, FOERST_VIST);
    const bedstPrDag = {};
    for (let i = 0; i < DAGE; i++) {
      const d = plus(iDag, i);
      const paa = alle.filter(t => t.fra <= d && d <= t.til);
      if (paa.length) bedstPrDag[d] = Math.min(...paa.map(t => t[maal]));
    }
    let html = "";
    for (let i = 0; i < DAGE; i++) {
      const d = dato(plus(iDag, i)), wd = d.getUTCDay();
      html += `<div class="tl-dag${i === 0 ? " i-dag" : ""}${wd === 0 || wd === 6 ? " weekend" : ""}" style="grid-row:1;grid-column:${i + 2}" title="${kort(plus(iDag, i))}">${UGEDAG[wd][0].toUpperCase()}<b>${i === 0 || wd === 1 ? d.getUTCDate() : "&nbsp;"}</b></div>`;
    }
    synlige.forEach((t, r) => {
      const start = Math.max(0, dageTil(t.fra)), stop = Math.min(DAGE - 1, dageTil(t.til));
      let bedst = false;
      for (let i = start; i <= stop; i++) if (bedstPrDag[plus(iDag, i)] === t[maal]) bedst = true;
      const kl = ["bar", bedst ? "bedst" : "", t.fra < iDag ? "fortsat-v" : "", t.til > slut ? "fortsat-h" : ""].join(" ");
      const titel = `${t.butik}: ${kr(t[maal])} ${enhed()}, ${t.pakning} for ${kr(t.pris)} kr, ${periode(t)}`;
      html += `<div class="tl-navn${bedst ? " bedst" : ""}" style="grid-row:${r + 2};grid-column:1"><b class="tal">${kr(t[maal])}</b> ${esc(t.butik)}</div>`;
      html += `<button class="${kl}" style="grid-row:${r + 2};grid-column:${start + 2} / ${stop + 3}" aria-label="${esc(titel)}" data-id="${esc(id(t))}"></button>`;
    });
    const flere = alle.length > FOERST_VIST
      ? `<button class="vis-flere" data-flere>${visAlle ? "Vis færre" : `Vis alle ${alle.length} tilbud`}</button>` : "";
    return `<section class="sektion"><h2>De næste 14 dage</h2><div class="kort tidslinje">
      <div class="tl-gitter">${html}</div>
      <p class="tl-forklaring">Tal i toppen er i dag og mandage. Mørkegrøn = billigst på mindst én dag. Tryk på en bjælke for detaljer.</p>${flere}</div></section>`;
  }

  function liste(lst, overskrift, bedstId) {
    if (!lst.length) return "";
    const rk = sorter(lst).map(t => {
      const chips = [];
      if (t.type !== "?") chips.push(`<span class="chip neutral">${esc(t.type)}</span>`);
      for (const n of t.noter) chips.push(`<span class="chip ${n.includes("ikke nævnt") ? "rav" : "neutral"}">${esc(n)}</span>`);
      const naar = t.fra > iDag ? `fra ${relDag(t.fra)}` : `til og med ${relDag(t.til)}`;
      return `<li id="t-${esc(id(t))}" class="${id(t) === bedstId ? "fremhaevet" : ""}" title="${esc(t.beskrivelse)}">
        <div class="logo" aria-hidden="true">${esc(initialer(t.butik))}</div>
        <div><div class="navn">${esc(t.butik)}</div>
          <div class="info">${esc(t.pakning)} for ${kr(t.pris)} kr · ${naar}</div></div>
        <div class="pris tal">${kr(t[maal])}<span>${enhed()}</span></div>
        ${chips.length ? `<div class="chips">${chips.join("")}</div>` : ""}
      </li>`;
    }).join("");
    return `<section class="sektion"><h2>${overskrift}</h2><ul class="kort liste">${rk}</ul></section>`;
  }


  // ---- Beregner
  const PANT = cl => cl >= 100 ? 3 : 1;   // Dansk Retursystem: dåser og flasker under 1 l = 1 kr, plast 1 l og op = 3 kr
  const enhedsord = t => t.antal >= 18 ? ["ramme", "rammer"] : t.antal > 1 ? ["pakke", "pakker"] : ["stk", "stk"];
  const maksAntal = t => { for (const n of t.noter) { const m = n.match(/max\.?\s*(\d+)/i); if (m) return +m[1]; } return null; };
  let beregnAntal = 3, beregnValg = {};
  try { beregnAntal = +localStorage.getItem("tilbud-antal") || beregnAntal; } catch (e) {}

  function beregnerIndhold(vare, valgmuligheder) {
    const t = valgmuligheder.find(x => id(x) === beregnValg[vare.navn]) || valgmuligheder[0];
    const [et, flere] = enhedsord(t);
    const n = beregnAntal, maks = maksAntal(t);
    const tilbudsAntal = maks ? Math.min(n, maks) : n, ekstra = n - tilbudsAntal;
    const liter = t.antal * t.cl / 100;
    const normalPrPak = vare.normal_literpris ? vare.normal_literpris * liter : null;
    const varer = tilbudsAntal * t.pris + (ekstra && normalPrPak ? ekstra * normalPrPak : 0);
    const stk = n * t.antal, pant = stk * PANT(t.cl), iAlt = varer + pant;
    const valg = valgmuligheder.map(x => `<option value="${esc(id(x))}"${x === t ? " selected" : ""}>${esc(x.butik)} · ${kr(x.literpris)} kr/l · ${esc(x.pakning)}${x.fra > iDag ? ` · fra ${relDag(x.fra)}` : ""}</option>`).join("");
    let noter = "";
    if (ekstra) noter += `<p class="note rav">${esc(t.butik)} sælger max ${maks} ${maks === 1 ? et : flere} pr. kunde. De sidste ${ekstra} er regnet til normalpris${normalPrPak ? `, ca. ${kr(normalPrPak)} kr pr. ${et}` : " (ukendt, ikke med i summen)"}.</p>`;
    if (normalPrPak) {
      const spar = n * normalPrPak - varer;
      if (spar > 0.5) noter += `<p class="note spar">Du sparer ca. ${kr(spar)} kr i forhold til normalpris.</p>`;
    }
    return `<h3>Hvad koster det?</h3>
      <select data-beregn-valg data-vare="${esc(vare.navn)}" aria-label="Tilbud">${valg}</select>
      <div class="stepper">
        <button data-antal="-1" aria-label="Færre" ${n <= 1 ? "disabled" : ""}>−</button>
        <output aria-live="polite">${n} ${n === 1 ? et : flere}<span>${stk} × ${t.cl} cl · ${kr(n * liter)} l</span></output>
        <button data-antal="1" aria-label="Flere" ${n >= 50 ? "disabled" : ""}>+</button>
      </div>
      <dl class="regning tal">
        <dt>${tilbudsAntal} × ${kr(t.pris)} kr${ekstra ? ` + ${ekstra} til normalpris` : ""}</dt><dd>${kr(varer)} kr</dd>
        <dt>Pant ${stk} × ${kr(PANT(t.cl))} kr</dt><dd>${kr(pant)} kr</dd>
        <dt class="i-alt">I alt inkl. pant</dt><dd>${kr(iAlt)} kr</dd>
      </dl>${noter}`;
  }

  const beregnerData = {};
  function beregner(vare, gaelder, kommende) {
    const valgmuligheder = [...sorter(gaelder), ...sorter(kommende)];
    if (!valgmuligheder.length) return "";
    beregnerData[vare.navn] = { vare, valgmuligheder };
    return `<div class="kort beregner ind f3" data-beregner="${esc(vare.navn)}">${beregnerIndhold(vare, valgmuligheder)}</div>`;
  }
  function opdaterBeregnere() {
    for (const el of document.querySelectorAll("[data-beregner]")) {
      const d = beregnerData[el.dataset.beregner];
      if (d) el.innerHTML = beregnerIndhold(d.vare, d.valgmuligheder);
    }
  }

  let data;
  function tegn() {
    const opd = new Date(data.opdateret);
    const dagTxt = new Intl.DateTimeFormat("sv-SE", { timeZone: "Europe/Copenhagen" }).format(opd);
    const kl = opd.toLocaleTimeString("da-DK", { hour: "2-digit", minute: "2-digit", timeZone: "Europe/Copenhagen" });
    document.getElementById("opdateret").textContent = `Opdateret ${relDag(dagTxt)} kl. ${kl}`;
    const flereVarer = data.varer.length > 1;
    document.getElementById("titel").textContent = flereVarer ? "Tilbud" : `${data.varer[0].emoji} ${data.varer[0].navn}`;
    document.querySelector("header .app").hidden = flereVarer;

    let html = "";
    for (const vare of data.varer) {
      const aktuelle = vare.tilbud.filter(t => t.til >= iDag);
      const gaelder = aktuelle.filter(t => t.fra <= iDag);
      const kommende = aktuelle.filter(t => t.fra > iDag);
      const bedst = sorter(gaelder)[0];
      if (flereVarer) html += `<h2 style="font-size:20px;font-weight:650;margin:32px 4px 12px">${esc(vare.emoji)} ${esc(vare.navn)}</h2>`;
      html += helt(vare, bedst) + raad(bedst, kommende) + beregner(vare, gaelder, kommende) + tidslinje(aktuelle);
      html += liste(gaelder, "Gælder i dag", bedst && id(bedst));
      html += liste(kommende, "Kommende");
    }
    const el = document.getElementById("indhold");
    el.innerHTML = html; el.removeAttribute("aria-busy");
  }

  document.addEventListener("click", e => {
    const trin = e.target.closest("[data-antal]");
    if (trin) {
      beregnAntal = Math.min(50, Math.max(1, beregnAntal + +trin.dataset.antal));
      try { localStorage.setItem("tilbud-antal", beregnAntal); } catch (e) {}
      opdaterBeregnere(); return;
    }
    if (e.target.closest("[data-flere]")) { visAlle = !visAlle; tegn(); return; }
    if (e.target.closest("[data-hent]")) { hent(); return; }
    const bar = e.target.closest(".bar");
    if (bar) {
      const li = document.getElementById("t-" + bar.dataset.id);
      if (li) {
        li.scrollIntoView({ behavior: "smooth", block: "center" });
        li.classList.remove("blink"); void li.offsetWidth; li.classList.add("blink");
      }
    }
  });

  document.addEventListener("change", e => {
    const v = e.target.closest("[data-beregn-valg]");
    if (v) { beregnValg[v.dataset.vare] = v.value; opdaterBeregnere(); }
  });

  function hent() {
    fetch("aktuelle.json", { cache: "no-store" })
      .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(d => { data = d; tegn(); })
      .catch(() => {
        document.getElementById("indhold").innerHTML = `<div class="kort fejl">Kunne ikke hente tilbuddene.<br>
          <span class="lille t3">Tjek forbindelsen og prøv igen.</span><br><button data-hent>Prøv igen</button></div>`;
      });
  }
  hent();
  // Hent nyt, når appen åbnes fra hjemmeskærmen igen
  document.addEventListener("visibilitychange", () => { if (!document.hidden && data) hent(); });
})();
</script>
</body>
</html>
